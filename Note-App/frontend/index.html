<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Note-App</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        
        <div id=container class="container">
            <header id="header" class="header">
                <h1>Note-App</h1>
            </header>

            <div id="controls" class="controls">
                <div id="controlsContainer" class="controlsContainer">
                    <button id="addNoteBtn">Add</button>
                </div>
            </div>

            <div id="notesContainer" class="notesContainer"></div>

            <div id="noNotes" class="emptySpace">
                <h3>No Notes</h3>
                <p>Add your first note using the "Add" button</p>
            </div>

            <div id="addNote" class="overlay">
                <div class="addNoteForm">
                    <form>
                        <div id="addNoteHeader" class="formBody">
                            <h2>Add Note</h2>
                            <button id="closeBtn">Close</button>
                        </div>
                        
                        <div id="addNoteBody" class="formBody">
                            <label for="title">Title : </label>
                            <input type="text" name="title" id="title" placeholder="title" required/>

                            <label for="noteContent">Note Content : </label>
                            <textarea name="noteContent" id="noteContent" placeholder="noteContent" required></textarea>
                            
                            <button type="submit" id="saveBtn">Save</button>
                        </div>

                    </form>
                </div>
            </div>

            <div class="overlay">
                <div class="confirmDeletion" class="overlay">
                    <div id="deletionMessage">
                        <p>Are you sure you want to delete?</p>
                    </div>

                    <div class="confirmationBtn">
                        <button id="cancelBtn">Cancel</button>
                        
                        <button id="deleteBtn">Delete</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="./app.js"></script>

    </body>
</html>
